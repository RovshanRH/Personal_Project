<!doctype html>
<html lang="en">

<head>
    <title>Контакты</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="stylesheet" href="../styles/contacts.css" />

</head>

<body>
    <header>
        <header class="site-header">
            <img src="../images/logo.png" alt="logo" class="header-logo" />
            <h1>Ходжакулыев Ровшан Рашидович</h1>
        </header>
        <nav class="main-nav">
            <a class="nav-link" href="../index.html" aria-current="page">Главная</a>
            <a class="nav-link" href="projects.html">Проекты</a>
            <a class="nav-link" href="diary.html">Дневник</a>
            <a class="nav-link active" href="#">Контакты</a>
        </nav>
    </header>
    
    <main>
        <div class="container">
            <h2 class="section-title">Свяжитесь со мной</h2>
            <div class="card">
                <div class="card-content">
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="name" required />
                        </div>
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required />
                        </div>
                        <div class="form-group">
                            <label for="message" class="form-label">Сообщение</label>
                            <textarea class="form-control" id="message" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-center">Отправить</button>
                    </form>
                </div>
            </div>
            
            <h2 class="section-title">Контакты</h2>
            <div class="card">
                <div class="card-content">
                    <div class="contact-info">
                        <p class="contact-item"><strong>Телефон:</strong> +7 (123) 456-7890</p>
                        <p class="contact-item"><strong>Email:</strong> example@mail.com</p>
                        <p class="contact-item"><strong>Город:</strong> Москва</p>
                        <p class="contact-item"><strong>Github:</strong> <a href="https://github.com/RovshanRH" target="_blank" class="contact-link">RovshanRH</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="site-footer">
        <p>&copy; 2025 <a href="./pages/contacts.html" class="footer-link">Контакты</a></p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Сообщение отправлено! (Это демо-версия)');
            this.reset();
        });
    </script>
</body>
</html>
